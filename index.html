<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift for Gun</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;900&display=swap" rel="stylesheet">
    <style>
        /* --- 纯净的 CSS 样式 --- */
        :root { --bg-color: #050505; --accent-color: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--accent-color); font-family: 'Inter', sans-serif; overflow-x: hidden; }

        .scatter-viewport {
            width: 100vw; height: 100vh; 
            overflow: hidden; position: relative; 
            display: flex; justify-content: center; align-items: center;
        }

        .scatter-bg-text {
            position: absolute;
            font-size: 25vw; font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            pointer-events: none; z-index: 0;
            white-space: nowrap;
        }

        /* 核心修复：绝对正方形的巨大响应式画布 */
        .scatter-canvas {
            width: 400vmin; height: 400vmin;
            position: absolute;
            top: 50%; left: 50%;
            /* 初始状态也是居中，由 JS 接管缩放和位移 */
            transform: translate(-50%, -50%);
            transform-origin: center center;
            will-change: transform;
            z-index: 1;
        }

        /* 响应式的照片卡片 */
        .scatter-item {
            position: absolute;
            width: 28vmin; height: 28vmin; /* 保持1:1，并适配屏幕 */
            border-radius: 8px;
            overflow: hidden;
            cursor: crosshair;
            background: #111;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), z-index 0s, box-shadow 0.4s;
        }

        .scatter-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: grayscale(80%) contrast(1.1);
            transition: filter 0.4s, transform 0.6s;
        }

        .scatter-item:hover {
            z-index: 999 !important;
            box-shadow: 0 40px 100px rgba(0,0,0,1), 0 0 0 2px rgba(255,255,255,0.2);
        }
        .scatter-item:hover img { filter: grayscale(0%) contrast(1); transform: scale(1.05); }

        .roam-indicator { position: absolute; bottom: 30px; width: 100%; text-align: center; font-size: 0.8rem; color: rgba(255,255,255,0.4); z-index: 2; pointer-events: none; letter-spacing: 0.2em; }
    </style>
</head>
<body>

    <main id="main-container">
        <section class="scatter-viewport" id="viewport">
            <div class="scatter-bg-text">COLLECTION</div>
            
            <div class="scatter-canvas" id="canvas-container">
                </div>
            
            <div class="roam-indicator">SCROLL TO EXPLORE</div>
        </section>
        
        <!-- <div style="height: 1000px;"></div>  -->
    </main>

    <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <script>
        // --- 1. 平滑滚动 ---
        const lenis = new Lenis({ duration: 1.2 });
        function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
        requestAnimationFrame(raf);

        // --- 2. 完美适应网格算法 ---
        function buildResponsiveCanvas() {
            const canvas = document.getElementById('canvas-container');
            const TOTAL = 100;
            const cols = 10;
            const cellSize = 40; // 对应 40vmin

            for (let i = 1; i <= TOTAL; i++) {
                const row = Math.floor((i - 1) / cols);
                const col = (i - 1) % cols;

                // 控制随机扰动在安全范围内，防止越界
                const randomX = (Math.random() * 8 - 4); // ±4vmin
                const randomY = (Math.random() * 8 - 4); // ±4vmin
                const randomRot = (Math.random() * 40 - 20); // ±20度

                const item = document.createElement('div');
                item.className = 'scatter-item';
                
                // 定位：以左上角为基准铺开
                item.style.left = `${(col * cellSize) + randomX + 6}vmin`; // +6vmin 是为了居中格子内的图片
                item.style.top = `${(row * cellSize) + randomY + 6}vmin`;
                
                item.style.setProperty('--base-rot', `${randomRot}deg`);
                item.style.transform = `rotate(${randomRot}deg)`;
                item.style.zIndex = Math.floor(Math.random() * 100);

                // 图片容错处理
                item.innerHTML = `<img src="images/${i}.png" onerror="this.src='https://images.unsplash.com/photo-1540497077202-7c8a3999166f?w=600&q=80'" alt="Item ${i}">`;
                
                item.addEventListener('mouseenter', () => item.style.transform = `rotate(0deg) scale(1.1)`);
                item.addEventListener('mouseleave', () => item.style.transform = `rotate(${item.style.getPropertyValue('--base-rot')})`);

                canvas.appendChild(item);
            }
        }

        // --- 3. 摄像机飞行轨迹 (修复版) ---
        // --- 3. 摄像机飞行轨迹 (Reveal-Color 升级版) ---
        window.onload = () => {
            buildResponsiveCanvas();
            gsap.registerPlugin(ScrollTrigger);

            const canvas = document.getElementById('canvas-container');

            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: "#viewport",
                    pin: true, // 钉住散落区域
                    start: "top top",
                    end: "+=8000", 
                    scrub: 1.2
                }
            });

            // 初始镜头：局部特写
            gsap.set(canvas, { xPercent: -20, yPercent: -20, scale: 1.5 });

            // 1. 飞行漫游轨迹
            tl.to(canvas, { xPercent: -80, yPercent: -30, scale: 1.3, ease: "sine.inOut", duration: 2 }) // 扫向右上
              .to(canvas, { xPercent: -70, yPercent: -80, scale: 1.6, ease: "sine.inOut", duration: 2 }) // 深入右下
              .to(canvas, { xPercent: -30, yPercent: -70, scale: 1.1, ease: "sine.inOut", duration: 2 }) // 迂回左下
              // 终极修复：回到中心
              .to(canvas, { xPercent: -50, yPercent: -50, scale: 0.22, ease: "power3.inOut", duration: 3 }); 

            // 【核心修复】：滑到全局时全彩 Reveal
            tl.add(() => {
                // 当镜头抵达全局时
                // 1. 一次性让 100 张图从灰度变彩色
                gsap.to(".scatter-item img", { filter: "grayscale(0%) contrast(1)", duration: 1.2, ease: "power2.out" });
                // 2. 隐藏滚动提示
                gsap.to(".roam-indicator", { opacity: 0, duration: 0.5 });
            }, "-=0.2"); // 比到达中心稍微提前 0.2 秒开始 Reveal，更自然
        };
      
    </script>
</body>
</html>
