<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Journey | Winter 26 Inspired</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <main id="main-container">
        
        <section class="hero">
            <div class="hero-content">
                <h1 class="reveal-text">WINTER 26</h1>
                <p class="sub-text">散落宇宙 · 无限漫游</p>
            </div>
            <div class="scroll-indicator">向下滚动开始探索</div>
        </section>

        <section class="scatter-viewport">
            <div class="scatter-bg-text">EXPLORE</div>
            
            <div class="scatter-canvas" id="canvas-container">
                </div>
            
            <div class="roam-indicator">滚动鼠标进行漫游 (Scroll to Roam)</div>
        </section>

        <section class="footer">
            <div class="footer-content">
                <h2>THE FUTURE IS NOW</h2>
                <p>© 2026 视觉实验室</p>
            </div>
        </section>

    </main>

    <script src="https://unpkg.com/@studio-freight/lenis@1.0.33/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <script src="main.js"></script>

</html>
